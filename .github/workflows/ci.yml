name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python tests
        run: |
          python -m pip install --quiet pytest
          PYTHONDONTWRITEBYTECODE=1 python -m pytest collect/tests -q
      - name: Frontend build
        run: |
          npm ci --no-audit --no-fund
          npm run build
